name: Build Windows installer

# Every push to main builds the installer and publishes it to the rolling
# "latest" release: https://github.com/kri7tallik/stratify/releases/latest
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri:build
      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/STRATIFY-setup.exe
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/STRATIFY.msi
      - name: Move "latest" tag to this commit
        shell: bash
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: STRATIFY (latest build)
          body: |
            Автоматическая сборка из `main` (${{ github.sha }}).
            **STRATIFY-setup.exe** — обычный установщик для Windows.
          prerelease: false
          make_latest: true
          files: |
            out/STRATIFY-setup.exe
            out/STRATIFY.msi
